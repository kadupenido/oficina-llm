services:
  backend:
    container_name: oficina-llm-backend
    build:
      context: ./backend
    networks: [chat]
    environment:
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://host.docker.internal:9080/v1}
      LLAMA_API_KEY: ${LLAMA_API_KEY}
      LLAMA_MODEL: ${LLAMA_MODEL:-}
      LLAMA_TIMEOUT_SECONDS: ${LLAMA_TIMEOUT_SECONDS:-300}
      LLAMA_ENABLE_THINKING: ${LLAMA_ENABLE_THINKING:-false}
      LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE:-8192}
      LLAMA_PARALLEL: ${LLAMA_PARALLEL:-1}
      MAX_TOKENS_DEFAULT: ${MAX_TOKENS_DEFAULT:-2048}
      MESSAGE_OVERHEAD_TOKENS: ${MESSAGE_OVERHEAD_TOKENS:-4}
      CONTEXT_RESERVE_TOKENS: ${CONTEXT_RESERVE_TOKENS:-256}
      CHARS_PER_TOKEN: ${CHARS_PER_TOKEN:-2.5}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-Você é um assistente útil. Responda no idioma do usuário, de forma clara e direta.}
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-false}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
      WEB_SEARCH_MAX_CHARS: ${WEB_SEARCH_MAX_CHARS:-12000}
      AGENT_MAX_TOOL_ROUNDS: ${AGENT_MAX_TOOL_ROUNDS:-3}
      FILE_UPLOAD_ENABLED: ${FILE_UPLOAD_ENABLED:-true}
      FILE_UPLOAD_MAX_BYTES: ${FILE_UPLOAD_MAX_BYTES:-5000000}
      FILE_UPLOAD_MAX_FILES: ${FILE_UPLOAD_MAX_FILES:-5}
      FILE_UPLOAD_MAX_CHARS: ${FILE_UPLOAD_MAX_CHARS:-100000}
    volumes:
      - backend-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    container_name: oficina-llm-frontend
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    networks: [chat]
    environment:
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-300}
      API_KEY: ${API_KEY:-}
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

networks:
  chat:
    name: chat

volumes:
  backend-data:
